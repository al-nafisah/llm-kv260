[project]
name = "llm-kv260"
version = "0.2.0"
description = "One LLM decoded by four Kria KV260 FPGAs: the bit-exact contract for the fabric engine, and the test vectors it is checked against"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "gguf>=0.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_kv260"]
