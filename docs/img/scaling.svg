<svg xmlns="http://www.w3.org/2000/svg" width="800" height="472" viewBox="0 0 800 472" role="img" aria-labelledby="title desc" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif">
<title id="title">Tokens per second and energy per token on 1, 2 and 4 boards</title>
<desc id="desc">1 board(s): 13.39, 13.51, 13.53 tokens/s; 0.460, 0.462, 0.459 J per token at 6.16, 6.25, 6.21 W; 2 board(s): 21.87, 21.75, 21.65 tokens/s; 0.530, 0.537, 0.539 J per token at 11.59, 11.68, 11.67 W; 4 board(s): 34.71, 36.69, 36.57 tokens/s; 0.645, 0.620, 0.621 J per token at 22.39, 22.76, 22.72 W; CPU only: 2.88 ± 0.07 tokens/s, 5.28 W, 1.83 J per token. Llama-3.2-1B-Instruct, every weight matrix ggml Q4_0, 400 generated tokens. Boards: run-tp.sh, 24-token prompt (positions 24-423), greedy, 3 runs each; medians 13.51, 21.75, 36.57 tokens/s, 1.61x on two boards and 2.71x on four. CPU only: llama-bench on board 1's four A53 cores, tg400 from an empty context (positions 0-399), 2.88 ± 0.07 (mean ± s.d.). Power: the INA260 on each running K26 module, about 10 samples/s; carrier cards, fans, power supplies and the switch are not measured. 2026-11-04, buildlog 0013; source: evidence/0013-tp-runs.txt, -power-*, -cpu-llama-bench.txt.</desc>
