<text x="20" y="30" class="h1">The engine on one board</text>
<text x="20" y="51" class="sub">Every token, the FPGA streams this board's quarter of the weights from DDR4 and multiplies it as it passes</text>

<!-- the A53 runtime and its two commands -->
<rect x="250" y="64" width="384" height="56" rx="8" fill="#e4f6ef" stroke="#1baf7a" stroke-width="1.2"/>
<text x="262" y="83" class="b">Runtime on one A53 core</text>
<text x="262" y="99" class="t">starts the multiply for this matrix, then names the next one;</text>
<text x="262" y="113" class="t">up to 2 MiB of it streams in while the CPU and network work</text>
