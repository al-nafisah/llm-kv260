<text x="176" y="422" class="s">activations in (8-bit, ggml Q8_0), once per call, copied into each unit</text>
<text x="176" y="450" class="s">results out: one 32-bit float per row</text>
<text x="176" y="476" class="s">activations and results share one 128-bit port; the weights have four</text>
<text x="664" y="201" class="t">results:</text>
<text x="664" y="216" class="t">one 32-bit float</text>
<text x="664" y="231" class="t">per output row,</text>
<text x="664" y="246" class="t">four per 128-bit</text>
<text x="664" y="261" class="t">write</text>

<!-- inside a MAC unit -->
<text x="20" y="514" class="h2">Inside each MAC unit, for every block of 32 weights</text>
<g class="chip">
  <rect x="20" y="526" width="128" height="26" rx="4" fill="#d7e6f9"/><text x="84" y="543">32 × (4-bit × 8-bit)</text>
  <rect x="166" y="526" width="84" height="26" rx="4" fill="#d7e6f9"/><text x="208" y="543">integer sum</text>
  <rect x="268" y="526" width="150" height="26" rx="4" fill="#d7e6f9"/><text x="343" y="543">× two scales, 32-bit float</text>
  <rect x="436" y="526" width="150" height="26" rx="4" fill="#d7e6f9"/><text x="511" y="543">add into lane (block mod 8)</text>
  <rect x="604" y="526" width="176" height="26" rx="4" fill="#b9d3f4"/><text x="692" y="543">end of row: 8 lanes, fixed tree</text>
</g>
<g stroke="#898781" stroke-width="1.5" marker-end="url(#ag)">
  <line x1="150" y1="539" x2="163" y2="539"/><line x1="252" y1="539" x2="265" y2="539"/>
  <line x1="420" y1="539" x2="433" y2="539"/><line x1="588" y1="539" x2="601" y2="539"/>
</g>
<text x="20" y="574" class="t">The integer sum is exact in any order and the float order is fixed by the contract (src/llm_kv260/q4_0.py),</text>
<text x="20" y="589" class="t">so the output is checked against it byte for byte: 9 of 9 test cases pass on each of the four boards (bench_gemv2).</text>

<text x="20" y="620" class="cap">gemv2 on the XCK26 (Vitis HLS and Vivado 2022.2), 250 MHz clock. Each reader deals alternate 144-byte chunks to its two buffers.</text>
<text x="20" y="636" class="cap">Sources: hls/gemv2/, hw/kv260_gemv2/build.tcl, board/tp/tp_llama.cpp. Weights are a load-time copy of the GGUF's Q4_0 blocks.</text>
</svg>
