<svg xmlns="http://www.w3.org/2000/svg" width="800" height="652" viewBox="0 0 800 652" role="img" aria-labelledby="title desc" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif">
<title id="title">The engine on one board (gemv2)</title>
<desc id="desc">The gemv2 engine on one KV260. The board's quarter of every weight matrix sits in DDR4 as 4-bit ggml Q4_0 blocks, in four regions, one per port. Four 128-bit memory ports (HP0 to HP3) feed the fetch kernel's four readers; each reader deals alternate 144-byte chunks to its two of eight on-chip buffers (AXI4-Stream FIFOs of 256 KiB each in UltraRAM, 2 MiB in all). Eight MAC units drain the buffers, one per buffer. Activations come in once per call as 8-bit Q8_0 and are copied into each unit; results go back as 32-bit floats, one per row; activations and results share one 128-bit port. In each unit, for every block of 32 weights: 32 products of a 4-bit weight and an 8-bit activation, summed as an integer, multiplied by the two block scales in float32, added into one of eight lanes; at the end of a row the eight lanes go through a fixed adder tree. The A53 runtime starts the multiply for each matrix and then names the next matrix, so the fetch kernel streams it into the buffers while the CPU and the network finish their part of the token. Hand-written diagram; facts from hls/gemv2, hw/kv260_gemv2/build.tcl and board/tp/tp_llama.cpp.</desc>
<!-- Hand-written. Colours as system.svg: blue #2a78d6 = FPGA engine, aqua #1baf7a = CPU.
     Facts: hls/gemv2/gemv2.h (4 ports, 2 MAC units per port), gemv_fetch.cpp (reader, 9-beat
     chunk toggle), gemv_mac.cpp (load_x, eight engine() units), hls/int4_core/gemv_core.h
     (block arithmetic, 8 lanes + tree), hw/kv260_gemv2/build.tcl (HP0..3 128-bit, FIFOs 16384 x
     128 bit in UltraRAM, 9:1 SmartConnect to HPC0, 250 MHz), board/tp/tp_llama.cpp:355-374
     (gemv then prefetch(next)); .work/understand/engine.md sections 5 and 7. -->
