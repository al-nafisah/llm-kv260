<text x="38" y="236" class="s">this board's quarter</text>
<text x="38" y="251" class="s">of every matrix,</text>
<text x="38" y="266" class="s">173.8 MB, read</text>
<text x="38" y="281" class="s">once per token</text>
<text x="38" y="304" class="s">four regions,</text>
<text x="38" y="319" class="s">one per port</text>
