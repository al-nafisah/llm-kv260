<svg xmlns="http://www.w3.org/2000/svg" width="800" height="742" viewBox="0 0 800 742" role="img" aria-labelledby="title desc" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif">
<title id="title">Four boards, one token stream</title>
<desc id="desc">Four Kria KV260 boards and a PC on one gigabit Ethernet switch. Between the boards runs a TCP full mesh, one connection per pair. Each board runs one rank: an A53 core does attention for its eight query heads, the norms and the sampling, and the FPGA engine streams that board's quarter of every weight matrix, 173.8 MB of 4-bit weights, from DDR4. Board 1 also serves the OpenAI-compatible API; the PC starts the ranks and sends prompts. q, k, v, gate, up and the output head are split by output rows, so each board computes its own quarter of the outputs with no all-reduce. The attention output and FFN down matrices are split by input columns, so each board holds a partial sum of every output and an all-reduce adds the four. Per layer: q k v, attention, attention output, all-reduce, gate and up, FFN down, all-reduce; after 16 layers the output head and one argmax exchange: 33 exchanges per token. Hand-written diagram; facts from board/tp/tp_llama.cpp and buildlog 0013.</desc>
<!-- Hand-written. Colours: blue #2a78d6 = FPGA engine, orange #eb6834 = network exchange,
     aqua #1baf7a = CPU; the same three roles as token.svg and scaling.svg. Facts:
     board/tp/tp_llama.cpp (sharding lines 240-279, exchange 396-525, forward 822-883),
     .work/understand/runtime.md sections 2-4, buildlog 0013 (173,776,896 B per board). -->
