<text x="432" y="641" class="t">next token, the same on all four boards</text>
<text x="20" y="674" class="t">33 exchanges per token: 2 all-reduces in each of the 16 layers, plus 1 argmax exchange.</text>

<g>
  <rect x="20" y="687" width="12" height="12" rx="2" fill="#2a78d6"/><text x="38" y="697" class="t">engine (FPGA)</text>
  <rect x="134" y="687" width="12" height="12" rx="2" fill="#eb6834"/><text x="152" y="697" class="t">exchange (network)</text>
