<text x="20" y="722" class="cap">Llama-3.2-1B-Instruct, every weight matrix ggml Q4_0: 695.1 MB of weights per token, 173.8 MB per board on four.</text>
<text x="20" y="738" class="cap">Runtime: board/tp/tp_llama.cpp. Partial sums are added in rank order on every board, so all four hold the same hidden state.</text>
</svg>
